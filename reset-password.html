<!doctype html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | JobPortal</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/main.js" defer></script>
  <script src="js/validation.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/logo.svg" alt="JobPortal" width="155" height="40">
      </a>
      <a href="login.html">Back to Login</a>
    </div>
  </header>

  <main class="auth-shell">
    <section class="auth-intro">
      <h1>Choose a New Password</h1>
      <p>Choose and confirm a new password for your account.</p>
    </section>

    <section class="auth-card" aria-labelledby="reset-heading">
      <h2 id="reset-heading">Reset Password</h2>
      <form action="#" method="post" data-action="password-reset">
        <div class="field">
          <label for="new-pass">New Password</label>
          <input id="new-pass" name="new_password" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="field">
          <label for="confirm-new-pass">Confirm New Password</label>
          <input id="confirm-new-pass" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <button class="button button-full" type="submit">Reset Password</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Job Portal</p>
    </div>
  </footer>
</body>
</html>
