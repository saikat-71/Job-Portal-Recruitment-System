<!DOCTYPE html>
<html>

<head>
    <title>Job Categories</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/job-categories.css">
    <link rel="icon" href="../images/favicon.svg">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="../images/logo.svg" alt="JobPortal">
        </div>
        <h3>Job Categories</h3>
        <div class="user-info">
            <img src="../images/profile-placeholder.svg" alt="Profile">
            <div>
                <h4>JobPortal User</h4>
                <p>Admin</p>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <a href="dashboard.html">Dashboard</a>
        <a href="users.html">User Management</a>
        <a href="job-categories.html" class="active">Job Categories</a>
        <a href="job-posts.html">Job Posts</a>
        <a href="reports.html">Reports</a>
        <a href="../login.html">Logout</a>
    </div>

    <div class="main">
        <h1>Job Categories</h1>
        <div class="category-controls">
            <input type="text" id="searchInput" placeholder="Search categories...">
            <button type="button" id="showFormBtn" class="add-btn"> + Add New Category </button>
        </div>

        <div class="category-form hidden" id="categoryFormBox">
            <h2 id="formTitle">Add New Category</h2>
            <form id="categoryForm">
                <label for="categoryName">Category Name</label>
                <input type="text" id="categoryName" placeholder="Enter category name" required>
                <label for="description">Description</label>
                <textarea id="description" placeholder="Enter description" required></textarea>
                <label for="status">Status</label>
                <select id="status" required>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

                <button type="submit" id="submitBtn">Add Category</button>
                <button type="button" id="cancelBtn" class="cancel-btn"> Cancel </button>
            </form>
        </div>


        <div class="recent-users">
            <h2>All Categories</h2>
            <table id="categoryTable">
                <tr>
                    <th>Category ID</th>
                    <th>Category Name</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </table>
        </div>
    </div>

    
    <div class="footer">
        <p>JobPortal - Job Portal & Recruitment System</p>
    </div>

    <script src="../js/admin.js"></script>
    <script src="../js/job-categories.js"></script>

</body>
</html>
