<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Evaluation | JobPortal</title>
  <link rel="stylesheet" href="../css/hr-manager.css">
  <script src="../js/hr-manager.js" defer></script>
</head>
<body>

<header class="hr-topbar">
  <a class="hr-brand" href="dashboard.html">JobPortal</a>
  <div class="hr-top-title">HR Manager Dashboard</div>
  <div class="hr-user"><span class="hr-avatar">HR</span><span>HR Manager</span></div>
</header>
<div class="hr-layout">
  <aside class="hr-sidebar">
    <nav>
      <a href="dashboard.html" >▦ Dashboard</a>
      <a href="interviews.html" >▤ Interviews</a>
      <a href="evaluations.html" class="active">♙ Candidates</a>
      <a href="hiring.html" >✓ Hiring</a>
      <a href="../profile.html">⚙ My Profile</a>
      <a href="../login.html" data-logout>⇥ Logout</a>
    </nav>
  </aside>

  <main class="hr-main">

    <a class="hr-back" href="dashboard.html">← Back to Dashboard</a>
    <h1>Candidate Evaluation</h1>
    <section class="hr-panel">
      <h2>Add / Update Candidate Evaluation</h2>
      <form id="evaluation-form">
        <input type="hidden" name="id">
        <div class="hr-form-grid">
          <label>Candidate Name<input name="candidate" required></label>
          <label>Job Position<input name="position" required></label>
          <label>Interview Rating<select name="rating" required><option value="">Choose rating</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
          <label>Evaluation Result<select name="result"><option>Pending</option><option>Recommended</option><option>Not Recommended</option></select></label>
          <label class="full">Interview Feedback<textarea name="feedback" rows="4" required placeholder="Write interview feedback..."></textarea></label>
        </div>
        <div class="hr-buttons"><button type="submit">Save Evaluation</button><button type="reset" class="secondary">Clear</button></div>
        <p id="ev-message" class="hr-message" role="status"></p>
      </form>
    </section>
    <h2>Candidate Evaluation Records</h2>
    <div class="hr-table-wrap"><table><thead><tr><th>Candidate</th><th>Position</th><th>Rating</th><th>Result</th><th>Feedback</th><th>Actions</th></tr></thead><tbody id="evaluation-rows"><tr><td colspan="6">No evaluations yet.</td></tr></tbody></table></div>

  </main>
</div>
</body>
</html>
