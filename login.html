<!doctype html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | JobPortal</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/auth.js" defer></script>
    <script src="js/validation.js" defer></script>
  </head>
  <body class="auth-page">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">
          <img src="images/logo.svg" alt="JobPortal" width="155" height="40">
        </a>
        <a href="index.html">Back to Home</a>
      </div>
    </header>
    <main class="auth-shell">
      <section class="auth-intro">
        <h1>Welcome Back!</h1>
        <p>Log in to your account.</p>
      </section>
      <section class="auth-card" aria-labelledby="login-heading">
        <h2 id="login-heading">Login</h2>
        <p>Enter your account details below.</p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="6" required>
          </div>
          <div class="field">
            <label for="login-role">Account Role</label>
            <select id="login-role" name="role" required>
              <option value="">Select your role</option>
              <option>Admin</option>
              <option>Recruiter</option>
              <option>Job Seeker</option>
              <option>HR Manager</option>
            </select>
          </div>
          <p class="forgot-link">
            <a href="reset-password.html">Forgot Password?</a>
          </p>
          <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
          <button class="button button-full" type="submit">Login</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a>.</p>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <p>Job Portal</p>
      </div>
    </footer>
  </body>
</html>
